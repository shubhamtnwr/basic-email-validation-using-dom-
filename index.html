<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign-up-form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div id="content-div">
            <h1>Stay Updated!</h1>
            <p>Join 60,000+ product managers receiving monthly<br> updates on:</p>
            <div id="list-div">
                <p><img src="images/icon-list.svg"><span>Product discovery and building what matters</span></p>
                <p><img src="images/icon-list.svg"><span>Measuring to ensure updates are a success</span></p>
                <P><img src="images/icon-list.svg"><span>And much more!</span></P>
            </div>
            <div id="email-handling">
                <div id="error-div">
                    <div id="email-address">Email-address</div>
                    <div id="err"></div>
                </div>
                <div id="email-div">
                    <input type="email" placeholder="email@company.com">
                </div>
            </div>
            <div id="button-div">
                <button>Subsribe to monthly newsletter</button>
            </div>
        </div>
        <div id="img-div">
            <img src="images/illustration-sign-up-desktop.svg">
        </div>
    </main>
    <div id="success-state">
        Thanks for subscribing !
        <button class="dismissBtn">Dismiss message</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
